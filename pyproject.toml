[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-venue-arb"
version = "0.1.0"
description = "Observe-only cross-venue crypto price-spread research scanner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cross-venue-arb contributors" }]
keywords = ["crypto", "arbitrage", "funding", "hyperliquid", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cross-venue-arb = "cross_venue_arb.cli:main"

[project.urls]
Homepage = "https://github.com/kentsmallt/cross-venue-arb"

[tool.setuptools.packages.find]
include = ["cross_venue_arb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
